name: Feature request
description: Suggest something Astral could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Astral to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
  - type: dropdown
    id: channel
    attributes:
      label: Which app are you using?
      options:
        - Stable
        - Beta
    validations:
      required: false
